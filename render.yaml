services:
  - type: web
    name: marsad
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL        # paste the Supabase connection string (Session pooler)
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_KEY
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: TIMEZONE
        value: Africa/Tripoli
