<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منظومة الخزينة والتصنيع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2430;--mut:#6b7380;--line:#e3e6eb;--side:#14202e;--side2:#1d2c3e;--pri:#0f766e;--pri2:#0d5f59;--soft:#e6f3f1;--red:#b42318;--redsoft:#fdecea;--amb:#b54708;--ambsoft:#fef4e6;--blue:#1d4ed8;--r:10px}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}
.layout{display:flex;min-height:100vh}
.side{width:232px;background:var(--side);color:#cfd8e3;flex-shrink:0;display:flex;flex-direction:column}
.brand{padding:18px 18px 14px;border-bottom:1px solid #26384d}
.brand b{display:block;color:#fff;font-size:16px}
.brand span{font-size:12px;color:#8fa1b5}
.nav{padding:10px 8px;flex:1}
.nav button{display:block;width:100%;text-align:right;background:none;border:0;color:#cfd8e3;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14.5px;margin-bottom:2px}
.nav button:hover{background:var(--side2)}
.nav button.on{background:var(--pri);color:#fff;font-weight:700}
.who{padding:14px 16px;border-top:1px solid #26384d;font-size:13px}
.who b{color:#fff}
.who button{margin-top:8px;background:#26384d;color:#fff;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
.main{flex:1;min-width:0;padding:22px 26px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0}
.sync{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--soft);color:var(--pri2)}
.sync.loc{background:var(--ambsoft);color:var(--amb)}
#upd{font-size:12px;background:#e8efff;color:var(--blue);padding:4px 10px;border-radius:20px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h3{margin:0 0 14px;font-size:16.5px}
.card h4{margin:14px 0 8px;font-size:14.5px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px}
.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%}
.span2{grid-column:span 2}
input,select,textarea{border:1px solid #cfd4dc;border-radius:7px;padding:8px 9px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid #99d5cd;border-color:var(--pri)}
input[type=number]{direction:ltr;text-align:right}
.btn{border:1px solid #cfd4dc;background:#fff;border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:#f2f4f7}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.btn.pri:hover{background:var(--pri2)}
.btn.dan{color:var(--red);border-color:#f1b5ae}
.btn.sm{padding:4px 9px;font-size:12.5px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap}
.muted{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:20px;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:#f7f8fa;color:var(--mut);font-weight:700;text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #eef0f3;vertical-align:middle}
tr.grp td{font-weight:700;background:#fafbfc}
tr.tot td{font-weight:800;background:#f2f4f7;border-top:2px solid var(--line)}
.num{text-align:left;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--red)}
.tw{overflow-x:auto}
.ln td{padding:5px 4px}
.ln input,.ln select{width:100%;padding:6px 7px}
.x{border:0;background:var(--redsoft);color:var(--red);border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi span{font-size:12.5px;color:var(--mut)}
.kpi b{display:block;font-size:20px;margin-top:6px;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.kpi small{color:var(--mut);font-size:11.5px}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:12px;background:#eef0f3;color:#3d4654;white-space:nowrap}
.pill.g{background:var(--soft);color:var(--pri2)}.pill.r{background:var(--redsoft);color:var(--red)}.pill.a{background:var(--ambsoft);color:var(--amb)}
.sum{display:flex;gap:18px;flex-wrap:wrap;background:#f7f8fa;border-radius:8px;padding:10px 14px;margin-top:12px}
.sum div{font-size:13px;color:var(--mut)}.sum b{color:var(--ink);font-size:15px;margin-inline-start:6px;direction:ltr;display:inline-block}
.modal{position:fixed;inset:0;background:rgba(15,23,35,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 12px;overflow:auto}
.mbox{background:#fff;border-radius:12px;width:min(760px,100%);padding:20px 22px}
.mbox h3{margin:0 0 14px}
#toast{position:fixed;bottom:20px;left:20px;z-index:60;display:flex;flex-direction:column;gap:8px}
.tst{background:#14202e;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tst.err{background:var(--red)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login{width:min(420px,100%)}
.login .card{padding:26px}
.login h2{margin:0 0 4px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:auto}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:right}
.tree-name{display:inline-block}
.note{background:var(--ambsoft);color:#7a3a07;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.inl{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.inl .fld{min-width:150px}
@media(max-width:900px){.layout{flex-direction:column}.side{width:100%}.nav{display:flex;overflow-x:auto;padding:6px}.nav button{white-space:nowrap;width:auto}.who{display:flex;justify-content:space-between;align-items:center}.who button{margin:0}.main{padding:14px}.span2{grid-column:auto}}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="muted">جاري تحميل المنظومة…</div></div></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>
<script>
/* ================== ثوابت ================== */
const PERMS=[
 ['dash','لوحة المتابعة','عام'],
 ['dash_fin','رؤية الأرصدة المالية في لوحة المتابعة','عام'],
 ['backdate','الترحيل بتاريخ سابق (غير تاريخ اليوم)','عام'],
 ['tr_in','سندات القبض','الخزينة والمصارف'],
 ['tr_out','سندات الصرف','الخزينة والمصارف'],
 ['tr_move','التحويل بين الخزائن والمصارف','الخزينة والمصارف'],
 ['tr_report','أرصدة وحركة الخزائن والمصارف','الخزينة والمصارف'],
 ['purchase','فواتير المشتريات','المخازن'],
 ['st_view','أرصدة وحركة المخازن','المخازن'],
 ['st_transfer','النقل بين المخازن والأرصدة الافتتاحية','المخازن'],
 ['items','الأصناف وقوائم المواد (BOM)','المصنع'],
 ['production','أوامر الإنتاج اليومي','المصنع'],
 ['sales','فواتير مبيعات صالة البيع','المبيعات'],
 ['see_cost','رؤية التكلفة وقيمة المخزون ومجمل الربح','المبيعات'],
 ['coa_view','عرض شجرة الحسابات','الحسابات'],
 ['coa_edit','إضافة وتعديل الحسابات','الحسابات'],
 ['journal_view','عرض دفتر اليومية','الحسابات'],
 ['journal','القيود اليومية اليدوية','الحسابات'],
 ['reverse','عكس (إلغاء) المستندات المرحّلة','الحسابات'],
 ['reports','التقارير المالية','الحسابات'],
 ['admin','المستخدمون والصلاحيات والإعدادات','الإدارة'],
];
const ALLP=PERMS.map(p=>p[0]);
const DEFAULT_ROLES={
 admin:{name:'مدير النظام',perms:ALLP,locked:true},
 fin:{name:'المدير المالي / المحاسب',perms:ALLP.filter(p=>p!=='admin')},
 cashier:{name:'أمين الخزينة',perms:['dash','dash_fin','tr_in','tr_out','tr_move','tr_report']},
 factory:{name:'مدير المصنع (الإنتاج)',perms:['dash','production','items','st_view']},
 store:{name:'أمين المخزن',perms:['dash','purchase','st_view','st_transfer']},
 sales:{name:'موظف صالة البيع',perms:['dash','sales','st_view']},
};
const TYPES={RV:'سند قبض',PV:'سند صرف',TR:'تحويل نقدي',PU:'فاتورة مشتريات',SA:'فاتورة مبيعات',PR:'أمر إنتاج',ST:'إذن نقل مخزني',OS:'رصيد افتتاحي مخزني',JV:'قيد يومية'};
const ATYPES={asset:'أصول',liability:'خصوم',equity:'حقوق ملكية',revenue:'إيرادات',expense:'مصروفات وتكاليف'};
const TAGS={'':'—',cash:'خزينة',bank:'مصرف',customer:'عميل',supplier:'مورد',fixed:'أصل ثابت',inv_raw:'مخزون خام ⚙',wip:'إنتاج تحت التشغيل ⚙',inv_fin:'مخزون إنتاج تام ⚙',inv_show:'مخزون صالة البيع ⚙',sales:'المبيعات ⚙',cogs:'تكلفة المبيعات ⚙',labor_applied:'أجور محملة ⚙',oh_applied:'تكاليف صناعية محملة ⚙',opening:'أرصدة افتتاحية ⚙'};
const SYS_TAGS=['inv_raw','wip','inv_fin','inv_show','sales','cogs','labor_applied','oh_applied','opening'];
const WH={RAW:{n:'مخزن المواد الخام',t:'inv_raw',k:'raw'},FIN:{n:'مخزن الإنتاج التام',t:'inv_fin',k:'fin'},SHOW:{n:'صالة البيع',t:'inv_show',k:'fin'}};
const PARTY={all:['كل الحسابات',a=>true],customer:['العملاء',a=>a.tag==='customer'],supplier:['الموردون',a=>a.tag==='supplier'],asset:['الأصول',a=>a.type==='asset'],expense:['المصروفات والتكاليف',a=>a.type==='expense'],revenue:['الإيرادات',a=>a.type==='revenue'],liability:['الخصوم',a=>a.type==='liability'],equity:['حقوق الملكية',a=>a.type==='equity']};
const LS_KEY='erp_mfg_v1';
/* لربط المنظومة تلقائياً بقاعدة Firebase على كل الأجهزة: ضع الإعدادات هنا بدل null */
const FIREBASE_CONFIG=null;
const FB_VER='10.12.2';
const USER_DOMAIN='@erp-users.app';
const FB_RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{db}/documents {
    function m() { return /databases/$(db)/documents/erp/master; }
    function member() { return request.auth != null && exists(m()) && request.auth.uid in get(m()).data.uids; }
    match /erp/master {
      allow read: if member() || (request.auth != null && !exists(m()));
      allow create: if request.auth != null && !exists(m());
      allow update, delete: if member();
    }
    match /days/{d} { allow read, write: if member(); }
  }
}`;

/* ================== حالة ================== */
let FB=null,FBAUTH=null,FBDB=null,AUTHU=null,CFG=null,FBUNSUB=[];
let DB=null,MODE='local',M=null,TX=[],ME=null,VIEW='dash',dirty=false,C={},READY=false,READONLY=false;
const SUB={};const RP={from:monthStart(),to:today()};
let AFTER=[],MODALCB=null;

/* ================== أدوات ================== */
function $(id){return document.getElementById(id)}
function val(id){const e=$(id);return e?e.value.trim():''}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function r2(n){return Math.round((+n||0)*100)/100}
function fm(n){n=r2(n);const s=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return n<0?'('+s+')':s}
function fq(n){return (Math.round((+n||0)*1000)/1000).toLocaleString('en-US',{maximumFractionDigits:3})}
function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function monthStart(){return today().slice(0,8)+'01'}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function fld(label,inner,cls){return `<div class="fld ${cls||''}"><label>${label}</label>${inner}</div>`}
function toast(m,k){const d=document.createElement('div');d.className='tst '+(k||'');d.textContent=m;$('toast').appendChild(d);setTimeout(()=>d.remove(),k==='err'?5000:3200)}
function openModal(h){$('mbox').innerHTML=h;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden');$('mbox').innerHTML='';MODALCB=null}
function confirmBox(msg,cb,label){MODALCB=cb;openModal(`<h3>تأكيد</h3><p>${msg}</p><div class="bar"><span></span><div><button class="btn" onclick="closeModal()">إلغاء</button> <button class="btn pri" onclick="const f=MODALCB;closeModal();f&&f()">${label||'تأكيد'}</button></div></div>`)}
function myPerms(){if(!ME)return[];if(ME.role==='admin')return ALLP;if(Array.isArray(ME.perms))return ME.perms;const r=M.roles[ME.role];return r?r.perms:[]}
function can(p){const ps=myPerms();if(Array.isArray(p))return p.some(x=>ps.includes(x));return ps.includes(p)}
function myCash(a){return (a.tag==='cash'||a.tag==='bank')&&(!ME||!ME.cash||!ME.cash.length||ME.cash.includes(a.id))}
function myWh(w){return !ME||!ME.whs||!ME.whs.length||ME.whs.includes(w)}
function dateIn(id){return `<input type="date" id="${id}" value="${today()}" ${can('backdate')?'':'readonly title="لا تملك صلاحية الترحيل بتاريخ سابق"'}>`}
function byCode(a,b){return a.code.localeCompare(b.code)}

/* ================== التخزين ================== */
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(s){M=s.master;TX=s.txs||[]}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({master:M,txs:TX}))}catch(e){toast('تعذر الحفظ في المتصفح','err')}}
let mq=Promise.resolve();
function saveMaster(){if(MODE==='fb'){const data=clone(M);mq=mq.then(()=>FBDB.doc('erp/master').set(data)).catch(fbFail);return mq}if(MODE==='db'){const data=clone(M);mq=mq.then(()=>DB.doc('erp/master').set(data)).catch(dbFail);return mq}saveLocal();return Promise.resolve()}
async function saveTx(tx){if(MODE==='fb'){try{await FBDB.collection('days').doc(tx.date).set({[tx.id]:tx},{merge:true})}catch(e){fbFail(e)}if(!TX.find(t=>t.id===tx.id))TX=[...TX,tx];return}if(MODE==='db'){await DB.collection('txs').doc(tx.id).set(tx);if(!TX.find(t=>t.id===tx.id))TX=[...TX,tx]}else{TX.push(tx);saveLocal()}}
function fbErr(e){const c=(e&&e.code)||'';const map={'auth/invalid-credential':'اسم المستخدم أو كلمة المرور غير صحيحة','auth/wrong-password':'اسم المستخدم أو كلمة المرور غير صحيحة','auth/user-not-found':'اسم المستخدم أو كلمة المرور غير صحيحة','auth/invalid-email':'اسم المستخدم غير صالح (حروف إنجليزية وأرقام فقط)','auth/email-already-in-use':'اسم المستخدم مسجّل مسبقاً','auth/weak-password':'كلمة المرور 6 خانات على الأقل','auth/operation-not-allowed':'فعّل تسجيل الدخول بـ Email/Password في Firebase Authentication','auth/too-many-requests':'محاولات كثيرة، انتظر قليلاً ثم حاول','auth/network-request-failed':'لا يوجد اتصال بالإنترنت','permission-denied':'لا توجد صلاحية — تأكد من نشر قواعد Firestore ومن تفعيل حسابك','auth/requires-recent-login':'سجّل الخروج والدخول ثم أعد المحاولة'};return map[c]||('خطأ: '+(e&&e.message||c))}
function fbFail(e){toast(fbErr(e),'err');throw e}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function userEmail(u){return String(u).trim().toLowerCase()+USER_DOMAIN}
function parseCfg(txt){if(!txt)return null;const g=k=>{const m=String(txt).match(new RegExp(k+'["\']?\\s*:\\s*["\']([^"\']+)["\']'));return m?m[1]:''};const c={apiKey:g('apiKey'),authDomain:g('authDomain'),projectId:g('projectId'),storageBucket:g('storageBucket'),messagingSenderId:g('messagingSenderId'),appId:g('appId')};return c.apiKey&&c.projectId?c:null}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('تعذر تحميل '+src));document.head.appendChild(s)})}
async function startFirebase(cfg){CFG=cfg;MODE='fb';
 try{for(const m of ['app','auth','firestore'])await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}-compat.js`)}catch(e){$('app').innerHTML='<div class="center"><div class="card login">تعذر تحميل مكتبات قاعدة البيانات. تأكد من الاتصال بالإنترنت ثم أعد تحميل الصفحة.</div></div>';return}
 FB=window.firebase;FB.initializeApp(cfg);FBAUTH=FB.auth();FBDB=FB.firestore();try{FBDB.settings({ignoreUndefinedProperties:true})}catch(e){}
 FBAUTH.onAuthStateChanged(u=>{FBUNSUB.forEach(f=>{try{f()}catch(e){}});FBUNSUB=[];AUTHU=u;M=null;TX=[];ME=null;
  if(!u){READY=true;render();return}READY=false;$('app').innerHTML='<div class="center"><div class="muted">جاري تحميل البيانات…</div></div>';subscribeFb()})}
function subscribeFb(){let gm=false,gt=false,denied=false;
 const go=()=>{if(denied){READY=true;return renderNoAccess()}if(!gm||(M&&!gt))return;const first=!READY;READY=true;if(first)render();else if(!dirty&&$('modal').classList.contains('hidden'))render();else{const u=$('upd');if(u)u.classList.remove('hidden')}};
 FBUNSUB.push(FBDB.doc('erp/master').onSnapshot(s=>{gm=true;M=s.exists?clone(s.data()):null;
   if(M&&!(M.uids||[]).includes(AUTHU.uid)){denied=true;return go()}
   if(M&&!gt&&!FBUNSUB.daysOn){FBUNSUB.daysOn=true;FBUNSUB.push(FBDB.collection('days').onSnapshot(q=>{gt=true;const all=[];q.docs.forEach(d=>{const o=d.data();for(const k in o)all.push(o[k])});TX=all;go()},e=>{toast(fbErr(e),'err')}))}
   go()},e=>{gm=true;if(e&&e.code==='permission-denied'){denied=true;go()}else toast(fbErr(e),'err')}))}
function dbFail(e){const c=e&&e.code;if(c==='invalid_argument'){READONLY=true;toast('لا تملك صلاحية الكتابة على بيانات هذه المنظومة المشتركة','err')}else if(c==='quota_exceeded')toast('امتلأت سعة قاعدة البيانات: '+(e.message||''),'err');else toast('تعذر الحفظ، حاول مرة أخرى','err');throw e}

async function boot(){
 let db=null;
 if(window.claude&&typeof claude.use==='function'){try{db=await claude.use('db')}catch(e){db=null}}
 if(db){DB=db;MODE='db';subscribe();return}
 const cfg=FIREBASE_CONFIG||parseCfg(lsGet('erp_fbcfg'));
 if(cfg)return startFirebase(cfg);
 if(lsGet('erp_mode')==='local'){MODE='local';loadLocal();READY=true;restoreSession();render();return}
 renderSetup();
}
function renderSetup(){$('app').innerHTML=`<div class="center"><div style="width:min(760px,100%)"><div class="card"><h2 style="margin-top:0">تشغيل منظومة الخزينة والتصنيع</h2><p class="muted">اختر طريقة حفظ البيانات. للعمل من أكثر من جهاز بمستخدمين متعددين اربط المنظومة بقاعدة بيانات Firebase المجانية من Google.</p>
 <h3>الطريقة الأولى: قاعدة بيانات مشتركة (موصى بها)</h3><ol style="line-height:1.9;padding-inline-start:20px;margin:0 0 10px">

/* ================== الحسابات المحسوبة ================== */
function calc(){
 C.acc={};M.accounts.forEach(a=>C.acc[a.id]=a);
 C.kids={};M.accounts.forEach(a=>{(C.kids[a.parent||'root']??=[]).push(a)});Object.values(C.kids).forEach(l=>l.sort(byCode));
 C.item={};M.items.forEach(i=>C.item[i.id]=i);
 C.tx=[...TX].sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0));
 C.revd=new Set(TX.filter(t=>t.rev).map(t=>t.rev));
 C.stock={};C.used=new Set();C.itemUsed=new Set();
 C.tx.forEach(t=>{(t.lines||[]).forEach(l=>C.used.add(l.a));(t.moves||[]).forEach(m=>{C.itemUsed.add(m.i);const s=(C.stock[m.i]??={});const w=(s[m.w]??={q:0,v:0});w.q+=m.q;w.v+=m.v})});
 C.bal=rollup(sumLines(()=>true));
}
function sumLines(f){const r={};C.tx.forEach(t=>{if(!f(t))return;t.lines.forEach(l=>{const x=(r[l.a]??={d:0,c:0});x.d+=+l.dr||0;x.c+=+l.cr||0})});return r}
function rollup(r){const o={};for(const id in r){let a=C.acc[id];while(a){const x=(o[a.id]??={d:0,c:0});x.d+=r[id].d;x.c+=r[id].c;a=C.acc[a.parent]}}return o}
function nat(a){if(a.nat)return a.nat;return(a.type==='asset'||a.type==='expense')?'d':'c'}
function signed(a,x){x=x||{d:0,c:0};return nat(a)==='d'?x.d-x.c:x.c-x.d}
function bal(id){return signed(C.acc[id],C.bal[id])}
function rootOf(a){while(a&&a.parent)a=C.acc[a.parent];return a}
function descIds(id){const out=[id];(C.kids[id]||[]).forEach(k=>out.push(...descIds(k.id)));return out}
function depth(a){let d=0;while(a.parent){d++;a=C.acc[a.parent]}return d}
function tagAcc(t){const a=M.accounts.find(a=>a.tag===t&&!a.group);return a?a.id:null}
function whAcc(w){return tagAcc(WH[w].t)}
function qty(i,w){return (C.stock[i]&&C.stock[i][w]&&C.stock[i][w].q)||0}
function avg(i){const s=C.stock[i];let q=0,v=0;if(s)for(const w in s){q+=s[w].q;v+=s[w].v}return q>1e-7?v/q:(+(C.item[i]&&C.item[i].cost)||0)}
function nextNo(type){return TX.filter(t=>t.type===type).reduce((m,t)=>Math.max(m,t.no||0),0)+1}
function txAmt(t){if(t.meta&&t.meta.amt!=null)return t.meta.amt;return t.lines.reduce((s,l)=>s+(+l.dr||0),0)}
function nextCode(pid){const p=pid?C.acc[pid]:null;const sibs=(p?C.kids[pid]:C.kids.root)||[];const pc=p?p.code:'';let w=sibs.length?Math.max(1,sibs[0].code.length-pc.length):1;const used=new Set(M.accounts.map(a=>a.code));for(;w<5;w++){for(let n=1;n<Math.pow(10,w);n++){const c=pc+String(n).padStart(w,'0');if(!used.has(c))return c}}return pc+Date.now().toString().slice(-4)}

/* ================== الترحيل ================== */
async function post(tx){
 if(READONLY)return toast('لا تملك صلاحية الكتابة','err');
 tx.lines=tx.lines.map(l=>({a:l.a,dr:r2(l.dr),cr:r2(l.cr),n:l.n||''})).filter(l=>l.dr||l.cr);
 const d=r2(tx.lines.reduce((s,l)=>s+l.dr,0)),c=r2(tx.lines.reduce((s,l)=>s+l.cr,0));
 if(!tx.lines.length)return toast('لا توجد مبالغ للترحيل','err');
 if(Math.abs(d-c)>0.009)return toast('القيد غير متوازن: مدين '+fm(d)+' / دائن '+fm(c),'err');
 if(tx.lines.some(l=>!C.acc[l.a]||C.acc[l.a].group))return toast('أحد الحسابات غير صالح أو غير معرّف في شجرة الحسابات (راجع الحسابات المرتبطة بالنظام ⚙)','err');
 if(!tx.date)return toast('حدد التاريخ','err');
 if(!tx.rev&&tx.date!==today()&&!can('backdate'))return toast('لا تملك صلاحية الترحيل بتاريخ غير تاريخ اليوم','err');
 tx.id=uid('t');tx.no=nextNo(tx.type);tx.user=ME.id;tx.uname=ME.name;tx.createdAt=Date.now();tx.moves=tx.moves||[];tx.meta=tx.meta||{};tx.desc=tx.desc||'';
 try{await saveTx(tx);toast('تم ترحيل '+TYPES[tx.type]+' رقم '+tx.no);dirty=false;render();return tx}catch(e){}
}
function reverseTx(id){const t=TX.find(x=>x.id===id);if(!t)return;
 confirmBox(`سيتم إنشاء مستند عكسي لـ <b>${TYPES[t.type]} رقم ${t.no}</b> يلغي أثره المالي والمخزني بتاريخ اليوم. هل تريد المتابعة؟`,()=>{
  const moves=(t.moves||[]).map(m=>({...m,q:-m.q,v:-m.v}));
  for(const m of moves){if(m.q<0&&qty(m.i,m.w)+m.q<-1e-6)return toast('لا يمكن العكس: رصيد '+C.item[m.i].name+' في '+WH[m.w].n+' غير كافٍ','err')}
  post({type:t.type,date:today(),desc:'عكس '+TYPES[t.type]+' رقم '+t.no+(t.desc?' — '+t.desc:''),rev:t.id,lines:t.lines.map(l=>({a:l.a,dr:l.cr,cr:l.dr,n:l.n})),moves,meta:{...(t.meta||{}),amt:-(txAmt(t))}})},'إنشاء مستند عكسي')}

function accOpts(filter,sel){const leafs=M.accounts.filter(a=>!a.group&&(!filter||filter(a)));let h='<option value="">— اختر الحساب —</option>';(C.kids.root||[]).forEach(r=>{const ls=leafs.filter(a=>rootOf(a).id===r.id).sort(byCode);if(!ls.length)return;h+=`<optgroup label="${esc(r.name)}">`+ls.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.code+' — '+a.name)}</option>`).join('')+'</optgroup>'});return h}
function accSelect(id,filter,sel,extra){return `<select id="${id}" ${extra||''}>${accOpts(filter,sel)}</select>`}
const isCash=a=>a.tag==='cash'||a.tag==='bank';
function fillParty(selId,kind){const f=PARTY[kind]||PARTY.all;$(selId).innerHTML=accOpts(a=>!isCash(a)&&f[1](a))}
function partyPicker(prefix,label){return fld('نوع الطرف المقابل',`<select id="${prefix}_kind" onchange="fillParty('${prefix}_party',this.value)">${Object.entries(PARTY).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select>`)+fld(label,`<div style="display:flex;gap:6px">${accSelect(prefix+'_party',a=>!isCash(a))}${can('coa_edit')?`<button class="btn sm" title="إضافة عميل أو مورد" onclick="quickParty('${prefix}_party')">+</button>`:''}</div>`)}
function quickParty(target){openModal(`<h3>إضافة طرف جديد</h3><div class="grid">${fld('النوع',`<select id="qp_kind"><option value="customer">عميل</option><option value="supplier">مورد</option></select>`)}${fld('الاسم',`<input id="qp_name">`)}</div><div class="bar"><span class="muted">يُضاف كحساب فرعي تحت مجموعة العملاء أو الموردين</span><div><button class="btn" onclick="closeModal()">إلغاء</button> <button class="btn pri" onclick="saveQuickParty('${target}')">حفظ</button></div></div>`)}
function saveQuickParty(target){const kind=val('qp_kind'),name=val('qp_name');if(!name)return toast('أدخل الاسم','err');const ref=M.accounts.find(a=>a.tag===kind);let pid=ref?ref.parent:null;if(!pid){const g=M.accounts.find(a=>a.group&&a.code===(kind==='customer'?'113':'211'));pid=g?g.id:null}if(!pid)return toast('لم يتم العثور على مجموعة '+(kind==='customer'?'العملاء':'الموردين'),'err');const p=C.acc[pid];const a={id:uid('a'),code:nextCode(pid),name,type:p.type,parent:pid,group:false,tag:kind,nat:''};M.accounts.push(a);saveMaster();calc();closeModal();const s=$(target);if(s){s.innerHTML=accOpts(x=>!isCash(x)&&(PARTY[$(target.replace('_party','_kind'))?.value||'all']||PARTY.all)[1](x),a.id);s.value=a.id}toast('تمت إضافة '+name)}

function txTable(list,empty){if(!list.length)return `<div class="muted">${empty||'لا توجد مستندات بعد.'}</div>`;return `<div class="tw"><table><thead><tr><th>الرقم</th><th>النوع</th><th>التاريخ</th><th>البيان</th><th class="num">المبلغ</th><th>المستخدم</th><th></th></tr></thead><tbody>${list.map(t=>`<tr><td>${t.no}</td><td><span class="pill ${t.rev?'r':''}">${TYPES[t.type]}${t.rev?' (عكسي)':''}</span>${C.revd.has(t.id)?' <span class="pill a">معكوس</span>':''}</td><td>${t.date}</td><td>${esc(t.desc)}</td><td class="num">${fm(txAmt(t))}</td><td class="muted">${esc(t.uname||'')}</td><td><button class="btn sm" onclick="showTx('${t.id}')">عرض</button></td></tr>`).join('')}</tbody></table></div>`}
function recent(types,n){return [...C.tx].filter(t=>types.includes(t.type)).reverse().slice(0,n||15)}
function showTx(id){const t=TX.find(x=>x.id===id);if(!t)return;const mt=t.meta||{};
 const info=[['النوع',TYPES[t.type]],['الرقم',t.no],['التاريخ',t.date],['المستخدم',t.uname],['البيان',t.desc]];
 if(mt.method)info.push(['طريقة الدفع',mt.method]);if(mt.ref)info.push(['المرجع',mt.ref]);if(mt.cust)info.push(['اسم العميل',mt.cust]);
 if(t.type==='PR'&&mt.product)info.push(['المنتج',(C.item[mt.product]||{}).name],['الكمية',fq(mt.qty)],['تكلفة الوحدة',fm(mt.unit)]);
 openModal(`<h3>${TYPES[t.type]} رقم ${t.no}</h3><div class="grid" style="margin-bottom:12px">${info.map(([k,v])=>`<div><div class="muted">${k}</div><b>${esc(v)}</b></div>`).join('')}</div>
 <h4>القيد المحاسبي</h4><div class="tw"><table><thead><tr><th>الحساب</th><th class="num">مدين</th><th class="num">دائن</th><th>ملاحظة</th></tr></thead><tbody>${t.lines.map(l=>{const a=C.acc[l.a]||{code:'?',name:'حساب محذوف'};return `<tr><td>${esc(a.code+' — '+a.name)}</td><td class="num">${l.dr?fm(l.dr):''}</td><td class="num">${l.cr?fm(l.cr):''}</td><td class="muted">${esc(l.n)}</td></tr>`}).join('')}<tr class="tot"><td>الإجمالي</td><td class="num">${fm(t.lines.reduce((s,l)=>s+l.dr,0))}</td><td class="num">${fm(t.lines.reduce((s,l)=>s+l.cr,0))}</td><td></td></tr></tbody></table></div>
 ${(t.moves||[]).length?`<h4>الحركة المخزنية</h4><div class="tw"><table><thead><tr><th>الصنف</th><th>المخزن</th><th class="num">الكمية</th><th class="num">القيمة</th></tr></thead><tbody>${t.moves.map(m=>`<tr><td>${esc((C.item[m.i]||{}).name||'?')}</td><td>${WH[m.w].n}</td><td class="num ${m.q<0?'neg':''}">${fq(m.q)}</td><td class="num">${fm(m.v)}</td></tr>`).join('')}</tbody></table></div>`:''}
 <div class="bar"><span>${C.revd.has(t.id)?'<span class="pill a">تم عكس هذا المستند</span>':''}</span><div>${can('reverse')&&!t.rev&&!C.revd.has(t.id)?`<button class="btn dan" onclick="closeModal();reverseTx('${t.id}')">إنشاء مستند عكسي</button> `:''}<button class="btn" onclick="closeModal()">إغلاق</button></div></div>`)}

 const prodQ=todays.filter(t=>t.type==='PR').reduce((s,t)=>s+(t.rev?-1:1)*Math.abs(+t.meta.qty||0),0),prodV=todays.filter(t=>t.type==='PR').reduce((s,t)=>s+txAmt(t),0);
 const salesV=todays.filter(t=>t.type==='SA').reduce((s,t)=>s+txAmt(t),0);
 const rin=todays.filter(t=>t.type==='RV').reduce((s,t)=>s+txAmt(t),0),rout=todays.filter(t=>t.type==='PV').reduce((s,t)=>s+txAmt(t),0);
 let h=`<div class="kpis">${k.map(([l,v])=>`<div class="kpi"><span>${l}</span><b>${fm(v)}</b><small>${esc(M.currency)}</small></div>`).join('')}</div>`;
 const t2=[];if(can('dash_fin')&&can(['tr_in','tr_out','tr_report']))t2.push(['مقبوضات اليوم',fm(rin)],['مدفوعات اليوم',fm(rout)]);if(can(['production','reports'])){t2.push(['إنتاج اليوم (وحدات)',fq(prodQ)]);if(can('see_cost'))t2.push(['تكلفة إنتاج اليوم',fm(prodV)])}if(can(['sales','reports'])&&can('dash_fin'))t2.push(['مبيعات اليوم',fm(salesV)]);
 if(t2.length)h+=`<div class="card"><h3>ملخص اليوم — ${td}</h3><div class="kpis" style="margin:0">${t2.map(([l,v])=>`<div class="kpi"><span>${l}</span><b>${v}</b></div>`).join('')}</div></div>`;
 if(can('dash_fin')&&can(['tr_report','reports'])){const cs=M.accounts.filter(a=>myCash(a)&&!a.group).sort(byCode);h+=`<div class="card"><h3>أرصدة الخزائن والمصارف</h3><table><thead><tr><th>الحساب</th><th>النوع</th><th class="num">الرصيد</th></tr></thead><tbody>${cs.map(a=>`<tr><td>${esc(a.code+' — '+a.name)}</td><td>${TAGS[a.tag]}</td><td class="num ${bal(a.id)<0?'neg':''}">${fm(bal(a.id))}</td></tr>`).join('')}</tbody></table></div>`}
 if(can(['st_view'])){const low=M.items.filter(i=>{const q=Object.keys(WH).reduce((s,w)=>s+qty(i.id,w),0);return C.itemUsed.has(i.id)&&q<=0});if(low.length)h+=`<div class="card"><h3>أصناف نفد رصيدها</h3>${low.map(i=>`<span class="pill r" style="margin:3px">${esc(i.name)}</span>`).join('')}</div>`}
 const mine=can('journal_view')?C.tx:C.tx.filter(t=>t.user===ME.id);
 h+=`<div class="card"><h3>${can('journal_view')?'آخر المستندات المرحّلة':'آخر مستنداتي'}</h3>${txTable([...mine].reverse().slice(0,10))}</div>`;
 const miss=SYS_TAGS.filter(t=>!tagAcc(t));if(miss.length&&can('coa_edit'))h=`<div class="note">لإكمال إعداد المنظومة: حدّد في شجرة الحسابات حساباً فرعياً لكل تصنيف نظامي التالي: ${miss.map(t=>TAGS[t]).join('، ')}. وأضف حسابات الخزائن والمصارف بتصنيف «خزينة» أو «مصرف».</div>`+h;
 if(!M.items.length&&can('items'))h=`<div class="note">ابدأ بتعريف الأصناف (المواد الخام والمنتجات النهائية) وقوائم المواد من صفحة «الأصناف وقوائم المواد»، ثم أدخل الأرصدة الافتتاحية من صفحة «المخازن».</div>`+h;
 return h};

  ${fld('رقم الصك / المرجع',`<input id="v_ref">`)}

  </div><div class="bar"><span id="v_bal" class="muted"></span><button class="btn pri" onclick="postVoucher('${t.cur}')">ترحيل ${isIn?'سند القبض':'سند الصرف'}</button></div>

 else if(t.cur==='move'){h+=`<div class="card"><h3>تحويل بين الخزائن والمصارف</h3><div class="grid">
  ${fld('التاريخ',`${dateIn('m_date')}`)}

  ${fld('المبلغ',`<input type="number" step="0.01" id="m_amt">`)}${fld('رقم المرجع',`<input id="m_ref">`)}${fld('البيان',`<input id="m_desc" placeholder="مثال: إيداع نقدية الصالة بالمصرف">`,'span2')}
  </div><div class="bar"><span class="muted">مثال: إيداع إيراد صالة البيع في المصرف، أو سحب من المصرف للخزينة.</span><button class="btn pri" onclick="postMove()">ترحيل التحويل</button></div></div>

 else if(t.cur==='rep'){const cs=M.accounts.filter(a=>myCash(a)&&!a.group).sort(byCode);let T={o:0,i:0,u:0};

function showCashBal(){const a=val('v_cash');$('v_bal').textContent=a?('الرصيد الحالي: '+fm(bal(a))+' '+M.currency):''}
function postVoucher(kind){const cash=val('v_cash'),party=val('v_party'),amt=r2(val('v_amt'));
 if(!cash||!party||!(amt>0))return toast('أكمل البيانات: الخزينة/المصرف والحساب المقابل والمبلغ','err');
 if(kind==='out'&&C.acc[cash].tag==='cash'&&bal(cash)<amt-0.001)return toast('رصيد الخزينة غير كافٍ (الرصيد '+fm(bal(cash))+')','err');
 const desc=val('v_desc')||((kind==='in'?'قبض من ':'صرف إلى ')+C.acc[party].name);
 post({type:kind==='in'?'RV':'PV',date:val('v_date'),desc,lines:kind==='in'?[{a:cash,dr:amt,cr:0},{a:party,dr:0,cr:amt}]:[{a:party,dr:amt,cr:0},{a:cash,dr:0,cr:amt}],meta:{method:val('v_method'),ref:val('v_ref'),amt,party,cash}})}
function postMove(){const f=val('m_from'),t=val('m_to'),amt=r2(val('m_amt'));if(!f||!t||!(amt>0))return toast('أكمل البيانات','err');if(f===t)return toast('لا يمكن التحويل لنفس الحساب','err');if(C.acc[f].tag==='cash'&&bal(f)<amt-0.001)return toast('رصيد '+C.acc[f].name+' غير كافٍ','err');
 post({type:'TR',date:val('m_date'),desc:val('m_desc')||('تحويل من '+C.acc[f].name+' إلى '+C.acc[t].name),lines:[{a:t,dr:amt,cr:0},{a:f,dr:0,cr:amt}],meta:{ref:val('m_ref'),amt}})}

/* ---------- خطوط الأصناف (مشتريات/مبيعات/نقل) ---------- */
let LN=null;
function itemOpts(kind,sel){return '<option value="">— الصنف —</option>'+M.items.filter(i=>!kind||i.kind===kind).map(i=>`<option value="${i.id}" ${i.id===sel?'selected':''}>${esc(i.code+' — '+i.name)}</option>`).join('')}
function lnTable(cfg){LN=cfg;AFTER.push(()=>{lnAdd();lnAdd()});return `<div class="tw"><table><thead><tr><th style="min-width:200px">الصنف</th><th>الوحدة</th><th style="width:120px">الكمية</th>${cfg.price?`<th style="width:130px">${cfg.priceLabel}</th><th class="num">الإجمالي</th>`:''}<th>المتاح</th><th></th></tr></thead><tbody id="ln_body"></tbody></table></div><button class="btn sm" style="margin-top:8px" onclick="lnAdd()">+ إضافة سطر</button><div class="sum" id="ln_sum"></div>`}
function lnAdd(){const tb=$('ln_body');if(!tb)return;const tr=document.createElement('tr');tr.className='ln';tr.innerHTML=`<td><select class="li" onchange="lnChange(this)">${itemOpts(LN.kind())}</select></td><td class="lu muted"></td><td><input type="number" class="lq" step="0.001" min="0" oninput="lnCalc()"></td>${LN.price?`<td><input type="number" class="lp" step="0.01" min="0" oninput="lnCalc()"></td><td class="lt num">0.00</td>`:''}<td class="la muted"></td><td><button class="x" onclick="this.closest('tr').remove();lnCalc()">×</button></td>`;tb.appendChild(tr)}
function lnReset(){const tb=$('ln_body');if(!tb)return;tb.innerHTML='';lnAdd();lnAdd();lnCalc()}
function lnChange(sel){const tr=sel.closest('tr');const it=C.item[sel.value];tr.querySelector('.lu').textContent=it?it.unit:'';if(it&&LN.price){const p=tr.querySelector('.lp');p.value=LN.defPrice(it)||''}const w=LN.wh();tr.querySelector('.la').textContent=it?fq(qty(it.id,w))+' '+it.unit:'';lnCalc()}
function lnRead(){return [...document.querySelectorAll('#ln_body .ln')].map(tr=>({i:tr.querySelector('.li').value,q:+tr.querySelector('.lq').value||0,p:LN.price?(+tr.querySelector('.lp').value||0):0})).filter(l=>l.i&&l.q>0)}
function lnCalc(){let tot=0,cost=0;document.querySelectorAll('#ln_body .ln').forEach(tr=>{const i=tr.querySelector('.li').value,q=+tr.querySelector('.lq').value||0;if(LN.price){const p=+tr.querySelector('.lp').value||0;const t=r2(q*p);tot+=t;tr.querySelector('.lt').textContent=fm(t)}if(i)cost+=q*avg(i)});const s=$('ln_sum');if(s)s.innerHTML=LN.summary(tot,cost)}
function lnAgg(lines){const m={};lines.forEach(l=>m[l.i]=(m[l.i]||0)+l.q);return m}
function stockCheck(agg,w){for(const i in agg){if(qty(i,w)<agg[i]-1e-6){toast('الرصيد غير كافٍ للصنف «'+C.item[i].name+'» في '+WH[w].n+' (المتاح '+fq(qty(i,w))+')','err');return false}}return true}

 const ia=whAcc(w);const moves=lines.map(l=>({i:l.i,w,q:l.q,v:r2(l.q*l.p)}));const tot=r2(moves.reduce((s,m)=>s+m.v,0));

V.production=()=>{if(!myWh('RAW')||!myWh('FIN'))return '<div class="card">أمر الإنتاج يحتاج صلاحية على مخزن المواد الخام ومخزن الإنتاج التام. راجع مدير النظام.</div>';const fins=M.items.filter(i=>i.kind==='fin');AFTER.push(prBuild);

function prRow(i,std,act){return `<tr class="ln"><td><select class="pi" onchange="prCalc()">${itemOpts('raw',i)}</select></td><td class="num ps">${std!=null?fq(std):'—'}</td><td><input type="number" class="pq" step="0.001" min="0" value="${act!=null?+act.toFixed(3):''}" oninput="prCalc()"></td><td class="num pa"></td><td class="num pc"></td><td class="num pv"></td><td><button class="x" onclick="this.closest('tr').remove();prCalc()">×</button></td></tr>`}
function prAddRow(){$('pr_body').insertAdjacentHTML('beforeend',prRow('',null,null));prCalc()}
function prBuild(onlyQty){const f=val('pr_item'),q=+val('pr_qty')||0;const b=M.boms[f];const tb=$('pr_body');if(!tb)return;
 if(!f){tb.innerHTML='';prCalc();return}
 tb.innerHTML=b&&b.lines.length?b.lines.map(l=>prRow(l.i,l.q*q,l.q*q)).join(''):'<tr><td colspan="7" class="muted">لا توجد قائمة مواد لهذا المنتج — أضف المواد يدوياً أو عرّف قائمة المواد.</td></tr>';
 $('pr_lab').value=b?r2((b.labor||0)*q)||'':'';$('pr_oh').value=b?r2((b.oh||0)*q)||'':'';prCalc()}
function prRead(){return [...document.querySelectorAll('#pr_body .ln')].map(tr=>({i:tr.querySelector('.pi').value,q:+tr.querySelector('.pq').value||0})).filter(l=>l.i&&l.q>0)}
function prCalc(){let mat=0;document.querySelectorAll('#pr_body .ln').forEach(tr=>{const i=tr.querySelector('.pi').value,q=+tr.querySelector('.pq').value||0;const a=i?avg(i):0;tr.querySelector('.pa').textContent=i?fq(qty(i,'RAW')):'';tr.querySelector('.pc').textContent=i?fm(a):'';const v=r2(q*a);tr.querySelector('.pv').textContent=fm(v);tr.querySelector('.pv').classList.toggle('neg',!!i&&qty(i,'RAW')<q);mat+=v});
 const lab=r2(val('pr_lab')),oh=r2(val('pr_oh')),q=+val('pr_qty')||0,tot=r2(mat+lab+oh);const s=$('pr_sum');if(!can('see_cost')){document.querySelectorAll('#pr_body .pc,#pr_body .pv').forEach(e=>e.textContent='');if(s)s.innerHTML=`<div>الكمية المنتجة<b>${fq(q)}</b></div>`;return}if(s)s.innerHTML=`<div>المواد الخام<b>${fm(mat)}</b></div><div>الأجور<b>${fm(lab)}</b></div><div>تكاليف غير مباشرة<b>${fm(oh)}</b></div><div>إجمالي تكلفة الإنتاج<b>${fm(tot)}</b></div><div>تكلفة الوحدة<b>${q>0?fm(tot/q):'—'}</b></div>`}
function postProduction(){const f=val('pr_item'),q=+val('pr_qty')||0;if(!f||!(q>0))return toast('اختر المنتج وأدخل الكمية المنتجة','err');const mats=prRead();const lab=r2(val('pr_lab')),oh=r2(val('pr_oh'));
 if(!mats.length&&!lab&&!oh)return toast('لا توجد تكاليف للإنتاج','err');if(!stockCheck(lnAgg(mats),'RAW'))return;
 const moves=mats.map(l=>({i:l.i,w:'RAW',q:-l.q,v:-r2(l.q*avg(l.i))}));const mat=r2(-moves.reduce((s,m)=>s+m.v,0));const tot=r2(mat+lab+oh);
 moves.push({i:f,w:'FIN',q,v:tot});const wip=tagAcc('wip');
 const lines=[{a:wip,dr:tot,cr:0,n:'تجميع تكاليف الإنتاج'}];if(mat)lines.push({a:whAcc('RAW'),dr:0,cr:mat,n:'مواد خام مستهلكة'});if(lab)lines.push({a:tagAcc('labor_applied'),dr:0,cr:lab,n:'أجور مباشرة محملة'});if(oh)lines.push({a:tagAcc('oh_applied'),dr:0,cr:oh,n:'تكاليف صناعية محملة'});
 lines.push({a:whAcc('FIN'),dr:tot,cr:0,n:'استلام إنتاج تام'},{a:wip,dr:0,cr:tot,n:'إقفال إنتاج تحت التشغيل'});
 post({type:'PR',date:val('pr_date'),desc:val('pr_desc')||('إنتاج '+fq(q)+' '+C.item[f].unit+' '+C.item[f].name),lines,moves,meta:{product:f,qty:q,mat,lab,oh,amt:tot,unit:tot/q}})}

  <div class="bar"><span class="muted">القيد: من حـ/ مخزون المخزن المستلم إلى حـ/ مخزون المخزن المرسل بالتكلفة.</span><button class="btn pri" onclick="postTransfer()">ترحيل إذن النقل</button></div></div><div class="card"><h3>آخر أذونات النقل</h3>${txTable(recent(['ST']))}</div>`}
 else if(t.cur==='os'){h+=`<div class="card"><h3>رصيد افتتاحي مخزني (بداية التشغيل أو الجرد)</h3><div class="grid">${fld('التاريخ',`${dateIn('os_date')}`)}${fld('المخزن',`<select id="os_wh" onchange="lnReset()">${Object.entries(WH).filter(([k])=>myWh(k)).map(([k,w])=>`<option value="${k}">${w.n}</option>`).join('')}</select>`)}${fld('البيان',`<input id="os_desc" value="رصيد افتتاحي">`,'span2')}</div>

  <div class="bar"><span class="muted">القيد: من حـ/ المخزون إلى حـ/ أرصدة افتتاحية.</span><button class="btn pri" onclick="postOpening()">ترحيل الرصيد الافتتاحي</button></div></div><div class="card"><h3>الأرصدة الافتتاحية المرحّلة</h3>${txTable(recent(['OS']))}</div>`}

 const moves=[];let tot=0;for(const i in agg){const v=r2(agg[i]*avg(i));tot+=v;moves.push({i,w:f,q:-agg[i],v:-v},{i,w:t,q:agg[i],v})}tot=r2(tot);

 return `<div class="card"><div class="bar" style="margin:0 0 12px"><input class="nodirty" placeholder="بحث في الحسابات…" oninput="coaFilter(this.value)" style="min-width:240px">${ed?'<button class="btn pri" onclick="accModal(\'\',\'\')">+ حساب رئيسي</button>':''}</div>

function accModal(id,pid){const a=id?C.acc[id]:{code:nextCode(pid||null),name:'',type:pid?C.acc[pid].type:'asset',parent:pid||null,group:false,tag:'',nat:''};const used=id&&(C.used.has(id)||(C.kids[id]||[]).length);const groups=M.accounts.filter(x=>x.group&&x.id!==id).sort(byCode);
 openModal(`<h3>${id?'تعديل حساب':'إضافة حساب'}</h3><div class="grid">
 ${fld('الحساب الأب',`<select id="ac_parent" ${id?'disabled':''} onchange="acParent()"><option value="">— حساب رئيسي —</option>${groups.map(g=>`<option value="${g.id}" ${g.id===a.parent?'selected':''}>${esc(g.code+' — '+g.name)}</option>`).join('')}</select>`)}
 ${fld('رمز الحساب',`<input id="ac_code" value="${esc(a.code)}">`)}${fld('اسم الحساب',`<input id="ac_name" value="${esc(a.name)}">`)}

 ${fld('نوع الحساب',`<select id="ac_type" ${a.parent?'disabled':''}>${Object.entries(ATYPES).map(([k,v])=>`<option value="${k}" ${k===a.type?'selected':''}>${v}</option>`).join('')}</select>`)}
 ${fld('التصنيف الخاص',`<select id="ac_tag">${Object.entries(TAGS).map(([k,v])=>`<option value="${k}" ${k===a.tag?'selected':''}>${v}</option>`).join('')}</select>`)}
 ${fld('نشاط التدفق النقدي',`<select id="ac_cf"><option value="">تلقائي</option>${Object.entries(CFL).map(([k,v])=>`<option value="${k}" ${a.cf===k?'selected':''}>${v}</option>`).join('')}</select>`)}
 ${fld('طبيعة الرصيد',`<select id="ac_nat"><option value="">تلقائي حسب النوع</option><option value="d" ${a.nat==='d'?'selected':''}>مدين</option><option value="c" ${a.nat==='c'?'selected':''}>دائن (حساب مقابل/مخصص)</option></select>`)}
 </div><div class="bar"><span>${id&&!used?`<button class="btn dan" onclick="delAcc('${id}')">حذف الحساب</button>`:id?'<span class="muted">لا يمكن حذف حساب عليه حركة أو له حسابات فرعية</span>':''}</span><div><button class="btn" onclick="closeModal()">إلغاء</button> <button class="btn pri" onclick="saveAcc('${id||''}')">حفظ</button></div></div>`)}
function acParent(){const p=val('ac_parent');$('ac_code').value=nextCode(p||null);const t=$('ac_type');if(p){t.value=C.acc[p].type;t.disabled=true}else t.disabled=false}
function saveAcc(id){const code=val('ac_code'),name=val('ac_name'),pid=id?C.acc[id].parent:(val('ac_parent')||null),group=val('ac_group')==='1',tag=val('ac_tag');
 if(!code||!name)return toast('أدخل الرمز والاسم','err');if(M.accounts.some(a=>a.code===code&&a.id!==id))return toast('رمز الحساب مستخدم','err');
 if(tag&&group)return toast('التصنيف الخاص يُحدد للحسابات الفرعية فقط','err');
 if(SYS_TAGS.includes(tag)&&M.accounts.some(a=>a.tag===tag&&a.id!==id))return toast('التصنيف «'+TAGS[tag]+'» مسند لحساب آخر. ألغه من الحساب الآخر أولاً','err');
 const type=pid?C.acc[pid].type:val('ac_type');
 if(id){const a=M.accounts.find(x=>x.id===id);const old=a.tag;if(SYS_TAGS.includes(old)&&old!==tag&&!M.accounts.some(x=>x.tag===old&&x.id!==id))return toast('لا يمكن إلغاء تصنيف نظامي دون إسناده لحساب آخر','err');Object.assign(a,{code,name,group,tag,nat:val('ac_nat'),cf:val('ac_cf')});if(!a.parent){a.type=type;M.accounts.forEach(x=>{if(descIds(id).includes(x.id))x.type=type})}}
 else M.accounts.push({id:uid('a'),code,name,type,parent:pid,group,tag,nat:val('ac_nat'),cf:val('ac_cf')});
 saveMaster();closeModal();render();toast('تم حفظ الحساب')}
function delAcc(id){const a=C.acc[id];if(SYS_TAGS.includes(a.tag))return toast('لا يمكن حذف حساب نظامي ⚙','err');M.accounts=M.accounts.filter(x=>x.id!==id);saveMaster();closeModal();render()}

V.journal=()=>{const t=tabs('journal',[['list','دفتر اليومية','journal_view'],['new','قيد يومية يدوي','journal']]);let h=t.html;
 if(t.cur==='list'){const ft=SUB.jt||'';const q=(SUB.jq||'').toLowerCase();const list=[...C.tx].filter(x=>x.date>=RP.from&&x.date<=RP.to&&(!ft||x.type===ft)&&(!q||(x.desc||'').toLowerCase().includes(q)||String(x.no)===q)).reverse();

  <div class="card"><h3>المستندات (${list.length})</h3>${txTable(list.slice(0,300),'لا توجد مستندات في هذه الفترة.')}</div>`}
 else{AFTER.push(()=>{jvAdd();jvAdd()});h+=`<div class="card"><h3>قيد يومية يدوي</h3><div class="grid">${fld('التاريخ',`${dateIn('jv_date')}`)}${fld('البيان',`<input id="jv_desc" placeholder="مثال: إثبات إهلاك الآلات عن الشهر">`,'span2')}</div>
  <div class="tw" style="margin-top:12px"><table><thead><tr><th style="min-width:240px">الحساب</th><th style="width:140px">مدين</th><th style="width:140px">دائن</th><th>ملاحظة</th><th></th></tr></thead><tbody id="jv_body"></tbody></table></div><button class="btn sm" style="margin-top:8px" onclick="jvAdd()">+ سطر</button><div class="sum" id="jv_sum"></div>

 return h};
function jvAdd(){const tb=$('jv_body');if(!tb)return;const tr=document.createElement('tr');tr.className='ln';tr.innerHTML=`<td><select class="ja">${accOpts()}</select></td><td><input type="number" step="0.01" class="jd" oninput="jvCalc()"></td><td><input type="number" step="0.01" class="jc" oninput="jvCalc()"></td><td><input class="jn"></td><td><button class="x" onclick="this.closest('tr').remove();jvCalc()">×</button></td>`;tb.appendChild(tr)}
function jvRead(){return [...document.querySelectorAll('#jv_body .ln')].map(tr=>({a:tr.querySelector('.ja').value,dr:+tr.querySelector('.jd').value||0,cr:+tr.querySelector('.jc').value||0,n:tr.querySelector('.jn').value})).filter(l=>l.a&&(l.dr||l.cr))}
function jvCalc(){const l=jvRead();const d=l.reduce((s,x)=>s+x.dr,0),c=l.reduce((s,x)=>s+x.cr,0);$('jv_sum').innerHTML=`<div>إجمالي المدين<b>${fm(d)}</b></div><div>إجمالي الدائن<b>${fm(c)}</b></div><div>الفرق<b class="${Math.abs(d-c)>0.009?'neg':''}">${fm(d-c)}</b></div>`}
function postJV(){const l=jvRead();if(l.length<2)return toast('القيد يحتاج سطرين على الأقل','err');if(l.some(x=>x.dr&&x.cr))return toast('السطر الواحد إما مدين أو دائن','err');post({type:'JV',date:val('jv_date'),desc:val('jv_desc')||'قيد يومية',lines:l})}

/* ---------- التقارير ---------- */
const CFL={op:'الأنشطة التشغيلية',inv:'الأنشطة الاستثمارية',fin:'الأنشطة التمويلية'};
function cfOf(a){let x=a;while(x){if(x.cf)return x.cf;x=C.acc[x.parent]}if(a.type==='equity')return 'fin';if(a.tag==='fixed')return 'inv';return 'op'}
function cfLabel(t,a){if(t.type==='SA')return 'متحصلات من المبيعات النقدية';if(t.type==='PU')return 'مدفوعات مشتريات نقدية';
 if(a.tag==='customer')return 'متحصلات من العملاء';if(a.tag==='supplier')return 'مدفوعات للموردين';if(a.type==='revenue')return 'إيرادات أخرى محصلة';
 if(a.type==='expense'){const la=tagAcc('labor_applied');const mr=la?rootOf(C.acc[la]):null;const r=rootOf(a);return mr&&r&&r.id===mr.id?'مدفوعات تكاليف التصنيع (أجور وتكاليف صناعية)':'مدفوعات المصروفات الإدارية والبيعية'}
 if(a.type==='liability')return 'سداد ومتحصلات التزامات تشغيلية';if(String(a.tag).startsWith('inv')||a.tag==='wip')return 'مدفوعات مخزون';return 'تدفقات تشغيلية أخرى (سلف وعهد وغيرها)'}
function cashFlow(from,to){const isC=id=>{const a=C.acc[id];return a&&isCash(a)};let open=0;const cat={op:{},inv:{},fin:{}},tot={op:0,inv:0,fin:0};
 C.tx.forEach(t=>{const net=t.lines.filter(l=>isC(l.a)).reduce((s,l)=>s+l.dr-l.cr,0);if(t.date<from){open+=net;return}if(t.date>to||Math.abs(net)<0.005)return;
  t.lines.forEach(l=>{if(isC(l.a))return;const a=C.acc[l.a];if(!a)return;const k=cfOf(a);const v=l.cr-l.dr;if(!v)return;const lab=k==='op'?cfLabel(t,a):a.name;cat[k][lab]=(cat[k][lab]||0)+v;tot[k]+=v})});
 return{open,cat,tot,close:open+tot.op+tot.inv+tot.fin}}
function ledgerTable(id,from,to,cashMode){const ids=new Set(descIds(id));const a=C.acc[id];let o={d:0,c:0};const rows=[];C.tx.forEach(t=>t.lines.forEach(l=>{if(!ids.has(l.a))return;if(t.date<from){o.d+=l.dr;o.c+=l.cr}else if(t.date<=to)rows.push({t,l})}));
 let run=signed(a,o);const sg=nat(a)==='d'?1:-1;let td=0,tc=0;
 return `<div class="tw"><table><thead><tr><th>التاريخ</th><th>المستند</th><th>البيان</th>${ids.size>1?'<th>الحساب الفرعي</th>':''}<th class="num">${cashMode?'مقبوض':'مدين'}</th><th class="num">${cashMode?'مدفوع':'دائن'}</th><th class="num">الرصيد</th></tr></thead><tbody><tr class="grp"><td colspan="${ids.size>1?4:3}">رصيد أول المدة</td><td></td><td></td><td class="num">${fm(run)}</td></tr>${rows.map(({t,l})=>{run+=sg*(l.dr-l.cr);td+=l.dr;tc+=l.cr;return `<tr><td>${t.date}</td><td><a href="#" onclick="showTx('${t.id}');return false">${TYPES[t.type]} ${t.no}</a></td><td>${esc(t.desc)}${l.n?` <span class="muted">— ${esc(l.n)}</span>`:''}</td>${ids.size>1?`<td class="muted">${esc(C.acc[l.a].name)}</td>`:''}<td class="num">${l.dr?fm(l.dr):''}</td><td class="num">${l.cr?fm(l.cr):''}</td><td class="num ${run<0?'neg':''}">${fm(run)}</td></tr>`}).join('')}<tr class="tot"><td colspan="${ids.size>1?4:3}">الإجمالي / رصيد آخر المدة</td><td class="num">${fm(td)}</td><td class="num">${fm(tc)}</td><td class="num">${fm(run)}</td></tr></tbody></table></div>`}
V.reports=()=>{const t=tabs('reports',[['tb','ميزان المراجعة'],['led','كشف حساب'],['is','قائمة الدخل'],['bs','المركز المالي'],['pr','تقرير تكاليف الإنتاج'],['cf','قائمة التدفقات النقدية'],['pt','كشف العملاء والموردين']]);let h=t.html+periodBar();
 if(t.cur==='tb'){const lv=+(SUB.tblv||9);const op=rollup(sumLines(x=>x.date<RP.from)),pe=rollup(sumLines(x=>x.date>=RP.from&&x.date<=RP.to));let T={od:0,oc:0,pd:0,pc:0,cd:0,cc:0};const rows=[];
  const walk=pid=>(C.kids[pid]||[]).forEach(a=>{const d=depth(a);const o=op[a.id]||{d:0,c:0},p=pe[a.id]||{d:0,c:0};const on=o.d-o.c,cn=on+p.d-p.c;if(!o.d&&!o.c&&!p.d&&!p.c)return;

 <div id="us_perms" style="columns:2;column-gap:20px;margin-top:8px;font-size:13.5px">${[...new Set(PERMS.map(p=>p[2]))].map(g=>`<div style="break-inside:avoid;margin-bottom:6px"><div style="font-weight:700;margin:8px 0 4px;color:var(--mut)">${g}</div>${PERMS.filter(p=>p[2]===g).map(p=>`<label class="chk" style="margin:3px 0"><input type="checkbox" class="up" value="${p[0]}"> ${p[1]}</label>`).join('')}</div>`).join('')}</div>
 <h4>الخزائن والمصارف المسموح بها <span class="muted">(بدون تحديد = الكل)</span></h4><div style="display:flex;flex-wrap:wrap;gap:6px 16px">${cashAccs.map(a=>`<label class="chk"><input type="checkbox" class="uc" value="${a.id}" ${(u.cash||[]).includes(a.id)?'checked':''}> ${esc(a.name)}</label>`).join('')||'<span class="muted">لا توجد حسابات خزائن أو مصارف بعد</span>'}</div>
 <h4>المخازن المسموح بها <span class="muted">(بدون تحديد = الكل)</span></h4><div style="display:flex;flex-wrap:wrap;gap:6px 16px">${Object.entries(WH).map(([k,w])=>`<label class="chk"><input type="checkbox" class="uw" value="${k}" ${(u.whs||[]).includes(k)?'checked':''}> ${w.n}</label>`).join('')}</div>
 <div class="bar"><span>${id&&id!==ME.id?`<button class="btn dan" onclick="delUser('${id}')">حذف المستخدم</button>`:''}</span><div><button class="btn" onclick="closeModal()">إلغاء</button> <button class="btn pri" onclick="saveUser('${id||''}')">حفظ</button></div></div>`);
 window._usInit=custom?u.perms:null;usRole()}
function usRole(){const r=val('us_role'),cu=$('us_custom').checked,adm=r==='admin';const base=window._usInit&&cu?window._usInit:(adm?ALLP:(M.roles[r]||{perms:[]}).perms);window._usInit=null;
 $('us_custom').disabled=adm;document.querySelectorAll('.up').forEach(c=>{c.checked=adm||base.includes(c.value);c.disabled=adm||!cu})}
async function saveUser(id){const name=val('us_name'),username=val('us_user'),pin=MODE==='fb'?($('us_pin')?$('us_pin').value:''):val('us_pin'),role=val('us_role'),active=val('us_act')==='1';
 if(MODE==='fb'){if(!name||!/^[a-zA-Z0-9._-]{2,}$/.test(username))return toast('أدخل الاسم واسم دخول بحروف إنجليزية وأرقام','err');if(!id&&pin.length<6)return toast('كلمة المرور 6 خانات على الأقل','err')}
 else if(!name||!username||pin.length<4)return toast('أدخل الاسم واسم الدخول ورمزاً من 4 خانات على الأقل','err');if(M.users.some(u=>u.username===username&&u.id!==id))return toast('اسم الدخول مستخدم','err');
 const admins=M.users.filter(u=>u.role==='admin'&&u.active!==false&&u.id!==id);if(!(role==='admin'&&active)&&!admins.length)return toast('يجب أن يبقى مدير نظام نشط واحد على الأقل','err');
 const custom=role!=='admin'&&$('us_custom').checked;const perms=custom?[...document.querySelectorAll('.up:checked')].map(c=>c.value):null;
 const cash=[...document.querySelectorAll('.uc:checked')].map(c=>c.value),whs=[...document.querySelectorAll('.uw:checked')].map(c=>c.value);
 const data={name,username,pin:MODE==='fb'?'':pin,role,active,perms,cash,whs};
 let newId=uid('u');
 if(MODE==='fb'&&!id){try{const sec=FB.apps.find(a=>a.name==='sec')||FB.initializeApp(CFG,'sec');const cr=await sec.auth().createUserWithEmailAndPassword(userEmail(username),pin);newId=cr.user.uid;await sec.auth().signOut()}catch(e){return toast(fbErr(e),'err')}}
 if(id)Object.assign(M.users.find(u=>u.id===id),data);else M.users.push({id:newId,...data});
 M.uids=M.users.filter(u=>u.active!==false).map(u=>u.id);if(id===ME.id)ME=M.users.find(u=>u.id===id);saveMaster();closeModal();render();toast('تم حفظ المستخدم')}
function delUser(id){confirmBox('حذف هذا المستخدم؟ تبقى مستنداته المرحّلة باسمه.',()=>{const u=M.users.find(x=>x.id===id);if(u&&u.role==='admin'&&!M.users.some(x=>x.id!==id&&x.role==='admin'&&x.active!==false))return toast('لا يمكن حذف آخر مدير نظام','err');M.users=M.users.filter(x=>x.id!==id);M.uids=M.users.filter(u=>u.active!==false).map(u=>u.id);saveMaster();render()},'حذف')}
function backupJSON(){return JSON.stringify({app:'erp_mfg',v:1,exported:new Date().toISOString(),master:M,txs:TX})}
async function exportData(){const data=backupJSON();const name='backup-'+today()+'.json';let dl=null;try{if(window.claude&&claude.use)dl=await claude.use('downloads')}catch(e){}
 if(dl){try{await dl.save({filename:name,data});return}catch(e){}}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){copyData()}}
async function copyData(){try{await navigator.clipboard.writeText(backupJSON());toast('تم نسخ البيانات — الصقها في ملف نصي واحفظه')}catch(e){toast('تعذر النسخ','err')}}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){return toast('الملف غير صالح','err')}if(!d||d.app!=='erp_mfg'||!d.master)return toast('هذا الملف ليس نسخة من هذه المنظومة','err');
 confirmBox(`سيتم استبدال كل البيانات الحالية بالنسخة (${(d.txs||[]).length} مستند). هل أنت متأكد؟`,()=>replaceAll(d.master,d.txs||[]),'استبدال البيانات')};r.readAsText(f)}
async function fbWipeDays(){const q=await FBDB.collection('days').get();for(const d of q.docs)await d.ref.delete()}
async function fbWriteTxs(txs){const by={};txs.forEach(t=>{(by[t.date]??={})[t.id]=t});for(const d in by)await FBDB.collection('days').doc(d).set(by[d])}
async function replaceAll(master,txs){if(MODE==='fb'){toast('جاري الاستيراد…');master={...master,users:M.users,uids:M.uids,roles:{...(master.roles||{}),...M.roles}};try{await fbWipeDays();await fbWriteTxs(txs);await FBDB.doc('erp/master').set(master)}catch(e){return toast(fbErr(e),'err')}M=master;TX=txs;render();toast('تم الاستيراد');return}
 if(MODE==='db'){toast('جاري الاستيراد…');try{for(const t of TX)if(!txs.find(x=>x.id===t.id))await DB.collection('txs').doc(t.id).delete();for(const t of txs)await DB.collection('txs').doc(t.id).set(t);await DB.doc('erp/master').set(master)}catch(e){return toast('تعذر إكمال الاستيراد: '+(e.message||''),'err')}}M=master;TX=txs;if(MODE!=='db')saveLocal();ME=M.users.find(u=>u.id===ME.id)||null;render();toast('تم الاستيراد')}
function resetAll(){openModal(`<h3>مسح كل البيانات</h3><p>سيتم حذف المستندات والأصناف وإعادة شجرة الحسابات للوضع الافتراضي${MODE==='fb'?' (يبقى المستخدمون)':' والمستخدمين'} نهائياً. اكتب <b>مسح</b> للتأكيد.</p><input id="rs_ok"><div class="bar"><span></span><div><button class="btn" onclick="closeModal()">إلغاء</button> <button class="btn dan" onclick="doReset()">مسح نهائي</button></div></div>`)}
async function doReset(){if(val('rs_ok')!=='مسح')return toast('اكتب كلمة التأكيد','err');closeModal();
 if(MODE==='fb'){try{await fbWipeDays();const m=defaultMaster(M.company,ME.name,'',false);m.users=M.users;m.uids=M.uids;m.roles=M.roles;await FBDB.doc('erp/master').set(m)}catch(e){return toast(fbErr(e),'err')}TX=[];toast('تم مسح البيانات مع الإبقاء على المستخدمين');return}if(MODE==='db'){try{for(const t of TX)await DB.collection('txs').doc(t.id).delete();await DB.doc('erp/master').delete()}catch(e){return toast('تعذر المسح','err')}}else{try{localStorage.removeItem(LS_KEY)}catch(e){}}M=null;TX=[];ME=null;render()}

/* ================== التهيئة والدخول ================== */
function renderInit(){$('app').innerHTML=`<div class="center"><div class="login"><div class="card"><h2>تهيئة المنظومة</h2><p class="muted">أول تشغيل: سيتم إنشاء شجرة حسابات كاملة للتصنيع والخزينة يمكنك تعديلها لاحقاً.</p>
 ${fld('اسم المنشأة',`<input id="i_co" placeholder="اسم الشركة أو المصنع">`)}<br>${fld('اسم مدير النظام',`<input id="i_ad" value="مدير النظام">`)}<br>${MODE==='fb'?'':fld('رمز الدخول للمدير (PIN)',`<input id="i_pin" type="password" inputmode="numeric" placeholder="4 خانات على الأقل">`)+'<br>'}
 ${fld('شجرة الحسابات',`<select id="i_tree"><option value="std">شجرة حسابات مقترحة للتصنيع والخزينة (بدون أي أرصدة)</option><option value="empty">شجرة فارغة — أضيف حساباتي بنفسي</option></select>`)}<p class="muted">تبدأ المنظومة فارغة: لا أصناف ولا أرصدة ولا مستندات، ومستخدم واحد فقط هو مدير النظام.</p>
 <div class="bar"><span class="muted">${MODE==='local'?'البيانات ستُحفظ في هذا المتصفح':'البيانات ستُحفظ في قاعدة مشتركة'}</span><button class="btn pri" onclick="doInit()">إنشاء المنظومة</button></div></div></div></div>`}
async function doInit(){const co=val('i_co')||'المنشأة',ad=val('i_ad')||'مدير النظام',pin=MODE==='fb'?'':val('i_pin');if(MODE!=='fb'&&pin.length<4)return toast('الرمز 4 خانات على الأقل','err');const m=defaultMaster(co,ad,pin,false);if(val('i_tree')==='empty')m.accounts=[];const txs=[];m.uids=[m.users[0].id];
 if(MODE==='fb'){m.users[0].id=AUTHU.uid;m.users[0].username=AUTHU.email.replace(USER_DOMAIN,'');m.uids=[AUTHU.uid];try{await FBDB.doc('erp/master').set(m)}catch(e){return toast(fbErr(e),'err')}return}
 if(MODE==='db'){try{await DB.doc('erp/master').set(m);for(const t of txs)await DB.collection('txs').doc(t.id).set(t)}catch(e){return toast(e&&e.code==='invalid_argument'?'لا تملك صلاحية إنشاء بيانات في هذه الصفحة':'تعذر الحفظ','err')}}
 M=m;TX=txs;if(MODE!=='db')saveLocal();ME=M.users[0];try{sessionStorage.setItem('erp_me',ME.id)}catch(e){}render()}
function renderLogin(){const us=M.users.filter(u=>u.active!==false);$('app').innerHTML=`<div class="center"><div class="login"><div class="card"><h2>${esc(M.company)}</h2><p class="muted">منظومة الخزينة والتصنيع — تسجيل الدخول</p>
 ${fld('المستخدم',`<select id="l_u">${us.map(u=>`<option value="${u.id}">${esc(u.name)} — ${esc((M.roles[u.role]||{}).name||'')}</option>`).join('')}</select>`)}<br>${fld('الرمز السري',`<input id="l_p" type="password" inputmode="numeric" onkeydown="if(event.key==='Enter')doLogin()">`)}
 <div class="bar"><span class="muted"></span><button class="btn pri" onclick="doLogin()">دخول</button></div></div></div></div>`;setTimeout(()=>$('l_p')&&$('l_p').focus(),50)}
function doLogin(){const u=M.users.find(x=>x.id===val('l_u'));if(!u||u.pin!==val('l_p'))return toast('الرمز السري غير صحيح','err');ME=u;try{sessionStorage.setItem('erp_me',u.id)}catch(e){}VIEW='dash';render()}

boot();
</script>
</body>
</html>
